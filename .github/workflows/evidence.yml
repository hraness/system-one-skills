name: Evidence and contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  # Per-SHA on main so every merge gets its own run; only superseded PR pushes cancel.
  group: evidence-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: node --test tests/transcript-admission.test.mjs
    timeout-minutes: 15

  required:
    name: Required
    if: always()
    needs: [check]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected job
        env:
          CHECK: ${{ needs.check.result }}
        run: |
          set -euo pipefail
          if [[ "$CHECK" != success ]]; then
            printf 'Unexpected required job result: %s\n' "$CHECK"
            exit 1
          fi
